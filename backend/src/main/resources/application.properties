spring.application.name=shop

spring.datasource.url = ${DATABASE_URL}
spring.datasource.password= ${DATABASE_PASSWORD}
spring.datasource.username=${DATABASE_USERNAME}

spring.jpa.show-sql=true
# Apply database/migrations/*.sql before starting the application.
spring.jpa.hibernate.ddl-auto=validate

# Keys such as products/1-center.jpg resolve against this local or public S3/CDN base.
app.media.base-url=${MEDIA_BASE_URL:/images}

# Explicit seeding only: start with --app.seed.enabled=true after applying migrations.
app.seed.enabled=false
app.seed.path=${CATALOG_SEED_PATH:../database/seeds/catalog.sql}
